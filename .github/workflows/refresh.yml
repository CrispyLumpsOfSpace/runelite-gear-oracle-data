name: Refresh datasets

on:
  schedule:
    # Weekly, Thursday morning UTC — the day after OSRS's Wednesday game updates, so new
    # content lands within a day of the wiki documenting it. Off the hour to be polite.
    - cron: '23 4 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch datasets from the OSRS Wiki
        run: python3 tools/fetch_data.py
        working-directory: ${{ github.workspace }}

      - name: Rewrite the client manifest
        run: python3 tools/manifest.py

      - name: Validate before publishing
        run: python3 tools/validate.py

      - name: Commit if anything changed
        run: |
          git config user.name "gear-oracle-data refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data fixtures
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Refresh datasets ($(date -u +%F))"
            git push
          fi
