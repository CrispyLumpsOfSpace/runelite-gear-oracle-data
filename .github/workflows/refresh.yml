name: Refresh datasets

on:
  schedule:
    # Weekly, Thursday morning UTC — the day after OSRS's Wednesday game updates, so new
    # content lands within a day of the wiki documenting it. Off the hour to be polite.
    - cron: '23 4 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch datasets from the OSRS Wiki
        run: python3 tools/fetch_data.py
        working-directory: ${{ github.workspace }}

      - name: Rewrite the client manifest
        run: python3 tools/manifest.py

      - name: Validate before publishing
        run: python3 tools/validate.py

      # Each refresh is a full snapshot, so staging is always exactly master plus one
      # commit; an unpromoted previous refresh is superseded, not lost.
      - name: Publish to staging if anything changed
        id: publish
        run: |
          git config user.name "gear-oracle-data refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data fixtures
          if git diff --cached --quiet; then
            echo "no changes against master"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh datasets ($(date -u +%F))"
            git push --force origin HEAD:staging
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure a promotion PR exists
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base master --head staging \
            --title "Promote staged dataset refresh" \
            --body "Published to staging by the refresh workflow. Merging serves it to clients; test first by launching the plugin with GEAR_ORACLE_DATA_BRANCH=staging." \
            || echo "promotion PR already open"
